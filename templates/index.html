<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <title>AdminExpress | Sign In</title>
</head>
<body>
    <main id="contenedor">
        <section id="izquierda" class="columna design-izquierda">
            <h1 class="logo">AdminExpress</h1>
        </section>
 
        <section id="derecha" class="columna design-derecha">
            <div class="login">
                <h2 class="login-titulo">Let's <strong>Sign In</strong> 👋</h2>
                <p class="login-texto">Hey, Enter your details to get sign in to your account.</p>
 
                <form class="formulario">
                    <div class="campo">
                        <label for="email">Email</label>
                        <div class="input-caja">
                            <svg class="nombre" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="m3 7 9 6 9-6"/>
                            </svg>
                            <input type="email" id="email" placeholder="Enter Email">
                        </div>
                    </div>
 
                    <div class="campo">
                        <label for="password">Password</label>
                        <div class="input-caja">
                            <svg class="nombre" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="5" y="11" width="14" height="10" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                            <input type="password" id="password" placeholder="Enter Password">
                            <svg class="nombre" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </div>
                    </div>
 
                    <a href="#" class="olvide">Forgot password?</a>
 
                    <button type="submit" class="boton">Sign In</button>
                </form>
 
                <p class="registro">Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </section>
    </main>
</body>
</html>
